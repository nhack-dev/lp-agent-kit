<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>特定商取引法に基づく表記</title><meta name="robots" content="noindex">
<style>body{margin:0;padding:24px 20px;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8;color:#222;max-width:720px;margin:auto}th,td{display:block;text-align:left;padding:4px 0}th{margin-top:14px;font-size:14px;color:#555}</style></head>
<body>
<h1>特定商取引法に基づく表記</h1>
<!-- 〇〇 をすべて実際の内容に置き換えてください。項目は消費者庁「特定商取引法ガイド」の通信販売で確かめること。 -->
<table>
<tr><th>販売事業者</th><td>〇〇</td></tr>
<tr><th>運営責任者</th><td>〇〇</td></tr>
<tr><th>所在地</th><td>〇〇（請求があれば遅滞なく開示する形にする場合は、その旨をここに書く）</td></tr>
<tr><th>電話番号</th><td>〇〇（同上）</td></tr>
<tr><th>メールアドレス</th><td>〇〇</td></tr>
<tr><th>販売価格</th><td>各商品ページに記載（税込）</td></tr>
<tr><th>商品代金以外に必要な料金</th><td>〇〇（送料・振込手数料など）</td></tr>
<tr><th>代金の支払時期・方法</th><td>〇〇</td></tr>
<tr><th>商品の引渡時期（サービス提供時期）</th><td>〇〇</td></tr>
<tr><th>申込みの撤回・解除（返品・キャンセル）</th><td>〇〇</td></tr>
</table>
</body></html>
